spring:
  application:
    name: ms-email
  profiles:
    default: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ms_email}
    username: ${DB_USERNAME:ms_email}
    password: ${DB_PASSWORD:ms_email}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

app:
  messaging:
    exchange: email.exchange
    queue: email.send.queue
    routing-key: email.send
    dead-letter-exchange: email.dlx
    dead-letter-queue: email.send.dlq
  aws:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${AWS_ENDPOINT:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
